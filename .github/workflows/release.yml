# Publishes a package to npm when its tag is pushed, after the same checks as CI:
# `iiif-embed-v<version>` for @awkw/iiif-embed, `maps-embed-v<version>` for @awkw/maps-embed. It
# signs in through npm trusted publishing (OIDC), so no npm token is stored, and npm records where
# the package was built (provenance). See README.md, "Releasing".
name: Release

on:
  push:
    tags: ['iiif-embed-v*', 'maps-embed-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run types
      - run: npm test
      - name: Which package, and the tag matches its version
        id: package
        run: |
          case "$GITHUB_REF_NAME" in
            iiif-embed-v*) name=@awkw/iiif-embed; dir=packages/iiif-sdk ;;
            maps-embed-v*) name=@awkw/maps-embed; dir=packages/maps-sdk ;;
          esac
          version=$(node -p "require('./$dir/package.json').version")
          [ "$GITHUB_REF_NAME" = "${name#@awkw/}-v$version" ] || { echo "Tag $GITHUB_REF_NAME, package $version" >&2; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - run: npm publish -w ${{ steps.package.outputs.name }}
